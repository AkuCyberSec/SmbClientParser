<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · SmbClientParser</title>
    <link rel="stylesheet" href="css/app.css" />
    <script src="js/theme.js"></script>
    <script type="module" src="js/login.js"></script>
  </head>
  <body>
    <main class="login-page">
      <form id="login-form" class="panel login-card" novalidate>
        <div class="panel-header">
          <span data-icon="lock"></span>
          <h1>SmbClientParser</h1>
        </div>
        <div class="panel-body">
          <p id="login-expired" class="banner info" role="status" hidden>Your session expired. Sign in again.</p>
          <div class="field">
            <label for="login-key">Access key</label>
            <input id="login-key" class="input mono" type="password" name="key" required autocomplete="current-password" autofocus />
            <span class="field-hint">Printed in the server console at startup, or set with -web-key / SMBCLIENTPARSER_WEB_KEY.</span>
          </div>
          <p id="login-error" class="field-error" role="alert"></p>
          <button id="login-submit" type="submit" class="button primary">Sign in</button>
        </div>
      </form>
    </main>
  </body>
</html>
